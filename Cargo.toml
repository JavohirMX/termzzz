[package]
name = "termzzz"
version = "0.0.1"
edition = "2024"

authors = ["javohirmx"]
description = "Screen savers and visual effects for terminal"
license = "MIT"
repository = "https://github.com/JavohirMX/termzzz"
documentation = "https://docs.rs/termzzz"
homepage = "https://github.com/JavohirMX/termzzz"

[dependencies]
# `serde` so `style::Color` can go straight into `GlobalOptions`. Parsing the
# colour at config load rather than at session start means a typo in
# `background` is reported with a TOML error and a line number, instead of
# silently falling back at the moment the screen is already being drawn.
crossterm = { version = "0.29", features = ["serde"] }
directories = "6.0"
env_logger = "0.11"
log = "0.4"

# The only dependency here that is not about rendering, terminal I/O or config.
# `clock` is the feature that brings `Local::now`, and it is the whole reason
# this is here: a clock effect that showed UTC, or that asked the user to keep a
# UTC offset up to date across a DST boundary, would be wrong twice a year.
#
# Default features are off deliberately. The defaults add `oldtime` (a
# deprecated pre-0.4 time zone table), `wasmbind` (for the browser, which is not
# a target here) and nothing else this crate uses. `clock` implies `now`, which
# implies `std`, and pulls `iana-time-zone` on unix.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

rand = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"

[dev-dependencies]
criterion = "0.8"
tempfile = "3.27"
# Already a runtime dependency; integration tests need it declared here too.
# Same features, because the config tests assert on `style::Color` values and
# the `serde` feature is what makes that type nameable from a parsed config.
crossterm = { version = "0.29", features = ["serde"] }
toml = "1"

[[bench]]
name = "rain_benchmarks"
harness = false

[[bench]]
name = "effect_benchmarks"
harness = false

# Optimized for speed. This is a real-time renderer: every effect does per-cell
# trigonometry 60 times a second, and `opt-level = "s"` suppresses the inlining
# and unrolling that work depends on. Size is not the constraint here, so this
# trades a little binary size for frame rate.
[profile.release]
panic = "abort"
strip = true  # Automatically strip symbols from the binary.
opt-level = 3
lto = true  # enable link time optimization
codegen-units = 1
