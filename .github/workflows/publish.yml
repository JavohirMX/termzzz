name: Publish to crates.io

on:
  workflow_dispatch:

jobs:
  guard:
    name: Verify publishing configuration
    runs-on: ubuntu-latest
    steps:
      - name: Require canonical repository
        env:
          CANONICAL_REPOSITORY: ${{ vars.TERMZZZ_CANONICAL_REPOSITORY }}
        run: |
          if [ -z "$CANONICAL_REPOSITORY" ]; then
            echo "::error::Repository variable TERMZZZ_CANONICAL_REPOSITORY is required"
            exit 1
          fi
          if [ "$CANONICAL_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::TERMZZZ_CANONICAL_REPOSITORY does not match this repository"
            exit 1
          fi

  publish:
    needs: guard
    if: vars.TERMZZZ_CANONICAL_REPOSITORY == github.repository && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Check if package is publishable
      run: cargo publish --dry-run --locked

    - name: Publish to crates.io
      env:
        CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      run: cargo publish --locked --token "$CRATES_IO_TOKEN"
