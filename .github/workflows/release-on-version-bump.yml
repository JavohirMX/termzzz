name: Release on Version Bump

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    name: Verify release configuration
    runs-on: ubuntu-latest
    steps:
      - name: Require canonical repository
        env:
          CANONICAL_REPOSITORY: ${{ vars.TERMZZZ_CANONICAL_REPOSITORY }}
        run: |
          if [ -z "$CANONICAL_REPOSITORY" ]; then
            echo "::error::Repository variable TERMZZZ_CANONICAL_REPOSITORY is required"
            exit 1
          fi
          if [ "$CANONICAL_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::TERMZZZ_CANONICAL_REPOSITORY does not match this repository"
            exit 1
          fi

  detect-version-change:
    needs: guard
    name: Detect version change
    if: vars.TERMZZZ_CANONICAL_REPOSITORY == github.repository && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(grep '^version = ' Cargo.toml | head -n1 | cut -d '"' -f 2)
          echo "Current: $CURRENT_VERSION"

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          PREV_VERSION="${PREVIOUS_TAG#v}"
          echo "Previous released version: ${PREV_VERSION:-<none>}"

          if [ "$CURRENT_VERSION" != "$PREV_VERSION" ] && [ -n "$CURRENT_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify existing release tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.detect.outputs.version }}
        run: |
          TAG="v$RELEASE_VERSION"
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            TAG_COMMIT=$(git rev-list -n 1 "refs/tags/$TAG^{commit}")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Existing release tag points to a different commit" >&2
              exit 1
            fi
          fi

  create-release:
    name: Create GitHub release
    needs: detect-version-change
    if: vars.TERMZZZ_CANONICAL_REPOSITORY == github.repository && github.ref == 'refs/heads/main' && needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create/Update release v${{ needs.detect-version-change.outputs.version }}
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.detect-version-change.outputs.version }}
          commit: ${{ github.sha }}
          name: v${{ needs.detect-version-change.outputs.version }}
          allowUpdates: true
          generateReleaseNotes: false
          draft: false
          prerelease: false

