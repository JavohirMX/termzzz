name: Release Assets

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag matching Cargo.toml (e.g., v0.0.2)'
        required: true

permissions:
  contents: write

jobs:
  guard:
    name: Verify release configuration
    runs-on: ubuntu-latest
    steps:
      - name: Require canonical repository
        env:
          CANONICAL_REPOSITORY: ${{ vars.TERMZZZ_CANONICAL_REPOSITORY }}
        run: |
          if [ -z "$CANONICAL_REPOSITORY" ]; then
            echo "::error::Repository variable TERMZZZ_CANONICAL_REPOSITORY is required"
            exit 1
          fi
          if [ "$CANONICAL_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::TERMZZZ_CANONICAL_REPOSITORY does not match this repository"
            exit 1
          fi

  build-and-upload:
    needs: guard
    name: Build for ${{ matrix.runner }} ${{ matrix.arch }}
    if: vars.TERMZZZ_CANONICAL_REPOSITORY == github.repository && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Get Rust toolchain version
      id: get_toolchain_version
      run: echo "RUST_TOOLCHAIN=$(grep 'channel =' rust-toolchain.toml | cut -d '"' -f 2)" >> $GITHUB_ENV

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        targets: ${{ matrix.target }}

    - name: Ensure target std is installed
      shell: bash
      run: |
        rustup target add ${{ matrix.target }} --toolchain ${{ env.RUST_TOOLCHAIN }}
        rustup target list --installed

    - name: Show toolchain info
      run: |
        rustc -vV
        cargo -vV
        rustup show
        rustup target list --installed

    - name: Resolve release tag
      id: tag
      shell: bash
      env:
        REQUESTED_TAG: ${{ github.event.inputs.tag_name }}
      run: |
        TAG_NAME="$REQUESTED_TAG"
        if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Release tag must look like v0.0.2" >&2
          exit 1
        fi
        CURRENT_VERSION=$(grep '^version = ' Cargo.toml | cut -d '"' -f 2)
        if [ "$TAG_NAME" != "v$CURRENT_VERSION" ]; then
          echo "Release tag must match Cargo.toml version v$CURRENT_VERSION" >&2
          exit 1
        fi
        if ! git show-ref --tags --verify --quiet "refs/tags/$TAG_NAME"; then
          echo "Release tag does not exist" >&2
          exit 1
        fi
        TAG_COMMIT=$(git rev-list -n 1 "refs/tags/$TAG_NAME^{commit}")
        if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
          echo "Release tag must point to the current main commit" >&2
          exit 1
        fi
        echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV

    - name: Build termzzz
      run: cargo build --release --locked --target ${{ matrix.target }}

    - name: Create archive and checksum
      shell: bash
      run: |
        # Standard naming convention for Homebrew: termzzz-{version}-{target}.tar.gz
        ASSET_NAME="termzzz-${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
        mkdir -p dist
        cp target/${{ matrix.target }}/release/termzzz dist/termzzz
        cp LICENSE dist/LICENSE
        cp README.md dist/README.md
        tar -czvf "$ASSET_NAME" -C dist termzzz LICENSE README.md
        echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum "$ASSET_NAME" | cut -d ' ' -f 1 > "$ASSET_NAME.sha256"
        else
          shasum -a 256 "$ASSET_NAME" | cut -d ' ' -f 1 > "$ASSET_NAME.sha256"
        fi

    - name: Upload release asset
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        files: |
          ${{ env.ASSET_NAME }}
          ${{ env.ASSET_NAME }}.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
