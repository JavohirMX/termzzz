# .github/workflows/additional-checks.yml
name: additional checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-audit:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cargo-audit
        # `--locked` is required, not an optimisation. Without it cargo-audit
        # resolves its newest dependencies, and `kstring@2.0.5` needs rustc
        # 1.96 while this repo pins 1.89 -- so the audit tool itself fails to
        # build and the job reports a toolchain error rather than a finding.
        run: cargo install cargo-audit --locked
      - name: run security audit
        run: cargo audit

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: check documentation
        env:
          rustdocflags: "-d warnings"
        run: cargo doc --no-deps --all-features --workspace
